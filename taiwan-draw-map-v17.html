<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>臺灣縣市特色繪圖靈感地圖</title>
<style>
:root{--bg1:#0b1437;--bg2:#1b2a6b;--tx:#fff;--card:rgba(255,255,255,.96);--ink:#2b2222;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2),#4a1b6b,var(--bg1));background-size:400% 400%;animation:bg 18s ease infinite;overflow-x:hidden}
@keyframes bg{50%{background-position:100% 100%}}
h1{margin:0;padding:14px 16px 0;font-size:clamp(20px,4vw,30px);text-align:center;text-shadow:0 0 14px #5ce1ff}
.sub{text-align:center;margin:4px 0 0;opacity:.85;font-size:14px}
.wrap{display:flex;flex-wrap:wrap;gap:14px;padding:10px;max-width:1250px;margin:auto}
.mapbox{flex:0 1 460px;min-width:290px;max-width:480px;margin:0 auto}
#m{width:100%;height:auto;display:block;border-radius:18px;box-shadow:0 0 24px rgba(92,225,255,.5);background:#e3f3f7}
.hit path,.hit rect{fill:rgba(255,255,255,.01);stroke:none;cursor:pointer;transition:fill .15s}
.hit:hover path,.hit:hover rect{fill:rgba(255,255,255,.4)}
.hit.sel path{fill:rgba(255,235,59,.55);stroke:#ff8f00;stroke-width:5;stroke-linejoin:round;animation:glow .8s ease-in-out infinite alternate}
.hit.sel rect{fill:rgba(255,235,59,.5);stroke:#ff8f00;stroke-width:5;animation:glow .8s ease-in-out infinite alternate}
@keyframes glow{to{filter:drop-shadow(0 0 7px #ffeb3b) brightness(1.2)}}
.sea{cursor:pointer}.bob{animation:bobm 4s ease-in-out infinite}.sea:hover .bob{filter:drop-shadow(0 0 8px #fff);animation-duration:1.6s}@keyframes bobm{50%{transform:translateY(-7px)}}.deco{font-size:46px;animation:fl 4s ease-in-out infinite;pointer-events:none}
.bub{fill:rgba(255,255,255,.6);stroke:#4fc3f7;stroke-width:1.4;animation:rise 7s linear infinite;pointer-events:none}
@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-200px);opacity:0}}
.panel{flex:1 1 400px;min-width:280px}
#t{font-size:clamp(24px,5vw,36px);margin:4px 0 10px;text-align:center;text-shadow:0 0 16px #ffeb3b;animation:pop .5s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--card);color:var(--ink);border-radius:20px;padding:10px 8px 10px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.35);opacity:0;animation:pop .6s cubic-bezier(.2,1.6,.4,1) forwards;animation-delay:calc(var(--i)*.09s)}
.card svg{width:132px;height:132px;display:block;margin:auto;cursor:zoom-in;animation:fl 3s ease-in-out infinite;animation-delay:calc(var(--i)*.3s)}
.card b{display:block;margin-top:2px;font-size:15px}
.card a{display:inline-block;margin-top:4px;font-size:12px;color:#3949ab;text-decoration:none;background:#e8eaf6;border-radius:10px;padding:2px 8px}
.card:hover{transform:rotate(-2deg) scale(1.05);transition:.2s}
@keyframes pop{0%{opacity:0;transform:scale(.2) rotate(-25deg)}100%{opacity:1;transform:none}}
@keyframes fl{50%{transform:translateY(-6px) rotate(3deg)}}
.sp{position:fixed;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:9;animation:sp .9s ease-out forwards}
@keyframes sp{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}
#ov{position:fixed;inset:0;background:rgba(5,10,40,.85);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:20;cursor:zoom-out;color:#fff;font-size:22px}
#ov.on{display:flex}
#ov div{background:#fff;border-radius:28px;padding:16px;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
#ov svg{width:min(80vw,420px);height:min(80vw,420px);display:block}
#ov a{display:inline-block;margin-top:2px;font-size:16px;color:#fff;text-decoration:none;background:#3949ab;border-radius:14px;padding:6px 18px;cursor:pointer}.tip{text-align:center;font-size:13px;opacity:.75;margin:10px 0 0}
</style>
</head>
<body>

    for(let k=0;k<26;k++){const s=document.createElement('span'),a=Math.random()*6.28,v=40+Math.random()*80;
      s.className='sp';s.style.cssText=`left:${cx}px;top:${cy}px;background:hsl(${Math.random()*360},90%,60%);--x:${Math.cos(a)*v}px;--y:${Math.sin(a)*v}px`;
      document.body.appendChild(s);setTimeout(()=>s.remove(),950);}}
}
m.addEventListener('click',e=>{const sv=e.target.closest('.sea');if(sv){openOv(sv.dataset.sea,sv.dataset.l+'（照著畫畫看！）',sv.dataset.l);return}const b=e.target.closest('.hit');if(b)show(+b.dataset.i,1,b)});
g.addEventListener('click',e=>{const s=e.target.closest('svg');if(!s)return;const c=s.closest('.card');
  openOv(c.dataset.id,c.dataset.l,c.dataset.l)});
ov.addEventListener('click',()=>ov.classList.remove('on'));document.getElementById('ova').addEventListener('click',e=>e.stopPropagation());
show(idx('基隆市'));
</script>
